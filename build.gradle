// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {

            // ارفع هذا الإصدار ليطابق متطلبات مكتباتك الجديدة
            classpath 'com.android.tools.build:gradle:8.7.0'
            // ارفع إصدار كوتلن لدعم ميزات اللغة الحديثة
            classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'
        // ارفع إصدار الـ SafeArgs ليتوافق مع إصدارات Navigation
            classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.9.7"


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}