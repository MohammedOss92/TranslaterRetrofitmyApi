
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.sarrawi.mytranslate"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'com.sarrawi.mytranslate'
    packaging {
        resources {
            excludes += '/META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

dependencies {

    //    implementation 'androidx.core:core-ktx:1.7.0'
//    implementation 'androidx.appcompat:appcompat:1.6.1'
//    implementation 'com.google.android.material:material:1.8.0'
//    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
//    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
//    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'
//    testImplementation 'junit:junit:4.13.2'
//    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    //Android Navigation Architecture
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.7'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation "androidx.work:work-runtime-ktx:2.11.1"

    implementation 'androidx.test.ext:junit-ktx:1.3.0'
    implementation 'com.google.firebase:firebase-messaging-ktx:24.1.2'
    implementation 'androidx.preference:preference:1.2.1'


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'


    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    implementation("com.squareup.okhttp3:logging-interceptor:5.3.2")

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Coroutine Lifecycle Scopes
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
//    implementation "androidx.activity:activity-ktx:1.12.4"

//room
    implementation "com.jakewharton.threetenabp:threetenabp:1.4.9"

    implementation 'androidx.room:room-common:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    // implementation "androidx.lifecycle:lifecycle-extensions:2.4.2"
    implementation "androidx.room:room-runtime:2.8.4"
    kapt  "androidx.room:room-compiler:2.8.4"
    implementation "androidx.room:room-paging:2.8.4"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0' // LifecycleScope
    implementation('androidx.paging:paging-common-ktx:3.4.1')
    implementation('androidx.paging:paging-runtime-ktx:3.4.1')
    implementation "androidx.work:work-runtime-ktx:2.11.1"


    //coil
    implementation("io.coil-kt:coil:1.1.1")

    implementation platform('com.google.firebase:firebase-bom:34.10.0')
}